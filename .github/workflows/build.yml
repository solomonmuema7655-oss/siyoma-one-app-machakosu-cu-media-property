name: Build SIYOMA CU Media APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q SIYOMA_ONE_APP-MACHAKOS_UNIVERSITY_CU_MEDIA_PROPERTY_BUILD_1.zip
          echo "Project extracted successfully"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip

      - name: Build APK
        run: |
          cd SIYOMA_ONE_APP-MACHAKOS_UNIVERSITY_CU_MEDIA_PROPERTY_BUILD_1/android
          ../../gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: siyoma-one-app-cu-media-debug-apk
          path: SIYOMA_ONE_APP-MACHAKOS_UNIVERSITY_CU_MEDIA_PROPERTY_BUILD_1/android/app/build/outputs/apk/debug/app-debug.apk
