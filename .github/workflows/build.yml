name: Build SIYOMA CU Media APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q -o SIYOMA_ONE_APP-MACHAKOS_UNIVERSITY_CU_MEDIA_PROPERTY_BUILD_1.zip -d project
          echo "Project extracted successfully"
          echo "Project files:"
          find project -maxdepth 3 -type f | head -100

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q -o gradle.zip

      - name: Build APK
        run: |
          cd project/android
          ../gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Check APK
        run: |
          ls -lh project/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: siyoma-one-app-cu-media-debug-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
